<section class="cd1-hero">
  <div class="cd1-shell cd1-hero-grid">
    <div class="cd1-hero-copy">
      <div class="cd1-eyebrow">Homeward Circles</div>
      <h1>Not just another small group.<br><em>A place to practice.</em></h1>
      <p class="cd1-lead">Homeward Circles are small, Jesus-centered communities where we practice together, learn from lived experience, and carry spiritual practices into everyday life.</p>
      <p class="cd1-season-line"><strong>An ongoing community, gathered in four-week seasons.</strong> A season gives us enough time to build a rhythm, show up consistently, and go deeper together—without asking anyone to commit forever.</p>
      <div class="cd1-actions">
        <a class="cd1-btn cd1-btn-primary" href="/index.html#interest">Tell Us You’re Interested</a>
        <a class="cd1-btn cd1-btn-ghost" href="#join">See How Joining Works</a>
      </div>
      <div class="cd1-logistics"><span>6–8 people</span><span>~90 minutes</span><span>Fort Worth + online</span><span>No cost</span></div>
    </div>
    <figure class="cd1-hero-image"><img src="/assets/circles-page-v62.webp" alt="People gathered in a warm Homeward Circle conversation"></figure>
  </div>
</section>

<section class="cd1-loop">
  <div class="cd1-shell">
    <div class="cd1-section-head cd1-on-dark">
      <div class="cd1-eyebrow">The Circle Loop</div>
      <h2>Practice. Live it. Come back. Go deeper.</h2>
      <p>The Circle is not only what happens in the room. Formation grows in the rhythm between gathering and everyday life.</p>
    </div>
    <div class="cd1-loop-grid">
      <article><b>01</b><h3>Practice together</h3><p>Experience a guided practice together so you know what it feels like—not simply what it means.</p></article>
      <article><b>02</b><h3>Reflect together</h3><p>Share what you noticed. Listen without fixing. Learn from the lived experience and wisdom of the group.</p></article>
      <article><b>03</b><h3>Carry it into life</h3><p>Use one simple practice during the week—in work, relationships, stress, gratitude, prayer, conflict, or quiet.</p></article>
      <article><b>04</b><h3>Return and deepen</h3><p>Come back with real experience: what helped, what was difficult, what surprised you, and what you are learning.</p></article>
    </div>
    <p class="cd1-loop-close">Community helps a practice become something you can actually return to.</p>
  </div>
</section>

<section class="cd1-practice">
  <div class="cd1-shell cd1-practice-grid">
    <figure class="cd1-practice-image"><img src="/assets/review/practices/BP-G.jpg" alt="A person seated comfortably with eyes closed, practicing quiet breath prayer"></figure>
    <div>
      <div class="cd1-eyebrow">Why practice matters</div>
      <h2>Spiritual practices are exercises for the heart and mind.</h2>
      <p class="cd1-lead">We do not practice breath prayer simply to become good at breath prayer. Like exercise for the body, repeated spiritual practice trains attention, awareness, response, openness, and our capacity to love.</p>
      <p>Over time, the hope is a life that feels more grounded, awake, connected, joyful, and receptive to God. Practicing with others adds encouragement, perspective, shared wisdom, and motivation to keep returning.</p>
    </div>
  </div>
  <div class="cd1-shell">
    <div class="cd1-benefits">
      <article><span>✓</span><h3>More Peace &amp; Steadiness</h3><p>Respond rather than react.</p></article>
      <article><span>✓</span><h3>More Joy &amp; Happiness</h3><p>Notice goodness, gratitude, beauty, and delight.</p></article>
      <article><span>✓</span><h3>Greater Focus &amp; Clarity</h3><p>Gather the mind and become more present.</p></article>
      <article><span>✓</span><h3>Deeper Connection</h3><p>Grow closer to God, yourself, and other people.</p></article>
      <article><span>✓</span><h3>More Love to Give</h3><p>Open the heart and carry the way of Jesus into daily life.</p></article>
    </div>
  </div>
</section>

<section class="cd1-season">
  <div class="cd1-shell">
    <div class="cd1-section-head">
      <div class="cd1-eyebrow">What is a season?</div>
      <h2>Homeward is ongoing. Circles move in four-week seasons.</h2>
      <p>A season is a focused four-week window to show up consistently, practice together, and build momentum. At the end there is a natural pause—not a graduation. You can continue into future seasons as your practices and relationships deepen.</p>
    </div>
    <div class="cd1-season-grid">
      <article><h3>A realistic commitment</h3><p>Four weeks is easier to plan around work, travel, family, and real life.</p></article>
      <article><h3>Consistency creates depth</h3><p>The same people return together, allowing trust and spiritual rhythm to grow.</p></article>
      <article><h3>No graduation</h3><p>Four weeks is a season—not the end of Homeward or your spiritual journey.</p></article>
      <article><h3>Season by season</h3><p>Future seasons can deepen familiar practices and introduce new tools for the spiritual life.</p></article>
    </div>
  </div>
</section>

<section class="cd1-talk">
  <div class="cd1-shell cd1-talk-grid">
    <div>
      <div class="cd1-eyebrow">How we talk together</div>
      <h2>A different kind of conversation.</h2>
      <p class="cd1-lead">The facilitator guides the process, but does not lecture or supply the approved conclusion. We learn through Scripture, practice, deep listening, and one another’s lived experience.</p>
      <blockquote>“What did you notice?” matters more than “Who has the best answer?”</blockquote>
    </div>
    <div class="cd1-principles">
      <article><b>1</b><div><h3>Speak from your own experience</h3><p>Share what you are noticing, learning, wondering, resisting, or trying—not what someone else should believe.</p></div></article>
      <article><b>2</b><div><h3>Listen without fixing</h3><p>No cross-talk, rescuing, debating, or correcting. Anyone may pass.</p></div></article>
      <article><b>3</b><div><h3>Let Scripture open the room</h3><p>Scripture gives us a shared center and doorway into honest exploration.</p></div></article>
      <article><b>4</b><div><h3>Learn from the wisdom in the room</h3><p>Insight can emerge through every participant’s lived experience—not only from the facilitator.</p></div></article>
    </div>
  </div>
</section>

<section class="cd1-midcta">
  <div class="cd1-shell cd1-midcta-inner">
    <div><div class="cd1-eyebrow">Curious about Circles?</div><h3>You don’t have to decide anything today.</h3><p>Ask questions, hear what a Circle feels like, and tell us what you’re looking for.</p></div>
    <div class="cd1-actions"><a class="cd1-btn cd1-btn-primary" href="/connect.html">Have a Conversation About Circles</a><a class="cd1-text-link" href="/index.html#interest">Or tell us you’re interested →</a></div>
  </div>
</section>

<section class="cd1-agenda">
  <div class="cd1-shell">
    <div class="cd1-section-head">
      <div class="cd1-eyebrow">What happens when we gather?</div>
      <h2>A guided 90 minutes with an engaging, unhurried pace.</h2>
      <p>You will not spend the whole evening listening to a talk. A Circle moves between settling, practice, Scripture or story, honest conversation, and a simple rhythm to carry into the week.</p>
    </div>
    <div class="cd1-agenda-list">
      <article><time>15–20 min</time><h3>Arrive &amp; reconnect</h3><p>Settle in, get to know one another, and become present.</p></article>
      <article><time>8–10 min</time><h3>Practice together</h3><p>Experience a guided contemplative practice together.</p></article>
      <article><time>10–15 min</time><h3>Scripture &amp; story</h3><p>Receive a passage or story as a doorway into reflection.</p></article>
      <article><time>25–30 min</time><h3>Honest conversation</h3><p>Speak from experience, listen deeply, and learn from the group.</p></article>
      <article><time>~10 min</time><h3>Carry it home &amp; blessing</h3><p>Choose a practice for the week and close together.</p></article>
    </div>
    <details class="cd1-details">
      <summary>See a full sample gathering: Week One — The Invitation Home</summary>
      <div class="cd1-details-body">
        <p><strong>Welcome · ~20 min — Settling in and getting to know each other.</strong> We begin with a simple question: <em>What drew you here?</em> Everyone is welcome to share, or to pass.</p>
        <p><strong>Practice · ~8 min — A guided breath prayer.</strong> A simple practice that steadies the mind and helps us become present to God. Breathing in: <em>Here I am.</em> Breathing out: <em>You are here.</em></p>
        <p><strong>Explore · ~15 min — A story and reflection.</strong> A short story Jesus told—the son who comes home to a father running to meet him—and an open conversation about God, grace, and how each of us hears it.</p>
        <p><strong>Conversation · ~30 min — Honest conversation.</strong> Questions might include: When you hear the word <em>home</em>, what image or longing comes to mind? Where do you long to experience welcome or belonging?</p>
        <p><strong>For the week · ~5 min — A practice to carry home.</strong> A few minutes of breath prayer on a few days this week using the same words: <em>Here I am. You are here.</em></p>
        <p><strong>Blessing · ~5 min.</strong> We each offer a word for how we are leaving and close with a simple blessing.</p>
      </div>
    </details>
  </div>
</section>

<section class="cd1-tools">
  <div class="cd1-shell">
    <div class="cd1-section-head">
      <div class="cd1-eyebrow">Tools for the spiritual life</div>
      <h2>Leave each season with practices you can actually use.</h2>
      <p>The goal is not more information. It is a growing spiritual tool belt: practices you know how to return to in real life—and a community that helps you keep using them until they become part of your rhythm.</p>
    </div>
    <div class="cd1-tools-grid">
      <article><h3>Breath Prayer</h3><p>Return to presence and steadiness.</p></article>
      <article><h3>Gratitude</h3><p>Train attention toward goodness, joy, happiness, and wonder.</p></article>
      <article><h3>Light of Christ</h3><p>Open the heart to receive and extend love.</p></article>
      <article><h3>Scripture as Encounter</h3><p>Receive Scripture as wisdom, invitation, and conversation.</p></article>
    </div>
    <p class="cd1-tools-close">Season by season, the practices deepen, the habits strengthen, and the spiritual life becomes more lived than merely understood.</p>
  </div>
</section>

<section class="cd1-compare">
  <div class="cd1-shell">
    <div class="cd1-section-head cd1-align-left">
      <div class="cd1-eyebrow">What makes a Circle different</div>
      <h2>Same desire for community. A different center of gravity.</h2>
      <p>Traditional small groups can offer friendship, learning, and support. Homeward Circles emphasize formation through practice and lived experience.</p>
    </div>
    <div class="cd1-compare-grid">
      <div class="cd1-compare-col">
        <h3>Many small groups emphasize…</h3>
        <article><h4>Learning about faith</h4><p>Teaching, study, discussion, interpretation.</p></article>
        <article><h4>Talking through ideas</h4><p>Opinions, questions, agreement, explanation.</p></article>
        <article><h4>The meeting itself</h4><p>The group experience is often concentrated in the weekly gathering.</p></article>
        <article><h4>A leader with content</h4><p>The leader may carry most of the teaching or answers.</p></article>
      </div>
      <div class="cd1-compare-col cd1-compare-homeward">
        <h3>A Homeward Circle emphasizes…</h3>
        <article><h4>Practicing the spiritual life</h4><p>We actually meditate, pray, listen, reflect, and engage Scripture together.</p></article>
        <article><h4>Speaking from lived experience</h4><p>We learn through what we are noticing and how the practice is meeting real life.</p></article>
        <article><h4>Practice between gatherings</h4><p>What happens Tuesday morning matters as much as what happens in the Circle.</p></article>
        <article><h4>A facilitator who holds the process</h4><p>The facilitator creates safety, rhythm, and depth without becoming the person with all the answers.</p></article>
      </div>
    </div>
    <p class="cd1-compare-note">This comparison is not a criticism of traditional groups. Homeward is designed to add a form of spiritual formation many people have never been given: a place to learn how to practice.</p>
  </div>
</section>

<section class="cd1-join" id="join">
  <div class="cd1-shell">
    <div class="cd1-section-head">
      <div class="cd1-eyebrow">How joining a Circle works</div>
      <h2>Three simple steps. No pressure.</h2>
      <p>You do not need to know exactly what you believe or whether a Circle is right for you before reaching out.</p>
    </div>
    <div class="cd1-join-grid">
      <article><b>1</b><h3>Tell us you’re interested</h3><p>Complete a short form. It takes only a couple of minutes and there is no commitment.</p><a href="/index.html#interest">Tell us you’re interested →</a></article>
      <article><b>2</b><h3>Have a conversation</h3><p>Ask questions, hear more about Homeward Circles, and tell us what you are looking for.</p><a href="/connect.html">Have a conversation →</a></article>
      <article><b>3</b><h3>We’ll help find the right Circle</h3><p>We’ll consider location, schedule, format, and fit as we form a Circle that makes sense for you.</p></article>
    </div>
  </div>
</section>

<section class="cd1-fit">
  <div class="cd1-shell cd1-fit-grid">
    <div><div class="cd1-eyebrow">You may feel at home if…</div><ul><li>You are seeking depth, connection, and a more lived spiritual life.</li><li>You are willing to explore Jesus and Scripture respectfully, even if your beliefs are unsettled.</li><li>You can speak from your own experience and listen without needing to correct others.</li><li>You are willing to practice between gatherings and support others on the journey.</li></ul></div>
    <div><div class="cd1-eyebrow">A Circle may not be the best fit if…</div><ul><li>Your primary purpose is to debate, disprove, convert, or require agreement.</li><li>You want a class built around one expert supplying the correct answers.</li><li>You are looking for group therapy or professional mental-health treatment.</li><li>You cannot respect confidentiality or the lived experience of other participants.</li></ul></div>
  </div>
</section>

<section class="cd1-final">
  <div class="cd1-shell">
    <div class="cd1-eyebrow">Finding Home · Season One</div>
    <h2>Practice the way. Explore honestly. Carry it into life.</h2>
    <p>Begin with one four-week season. Continue the journey as Homeward becomes part of your ongoing spiritual life.</p>

  </div>
</section>`;
