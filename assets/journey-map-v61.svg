<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 940" role="img" aria-labelledby="title desc">
<title id="title">The lifelong Journey of Faith</title><desc id="desc">A spiral path through six recurring seasons of faith: inherited faith, honest questions, sacred search, new foundations, embodied faith, and living awake.</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#061b14" flood-opacity=".28"/></filter></defs>
<rect width="760" height="940" rx="34" fill="#21483b"/>
<text x="54" y="66" fill="#e0a443" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">A LIFELONG SPIRAL</text>
<text x="54" y="112" fill="#faf6ef" font-family="Georgia,serif" font-size="35" font-weight="700">Not a ladder. Not a test.</text>
<text x="54" y="148" fill="#dce6df" font-family="Arial,sans-serif" font-size="18">We revisit these seasons as life changes and faith deepens.</text>
<g transform="translate(380 510)" fill="none" stroke="#e0a443" stroke-width="12" stroke-linecap="round" filter="url(#shadow)">
<path d="M0 0 C-34 -50 -109 -28 -113 34 C-120 126 30 162 111 95 C221 4 141 -176 -15 -188 C-220 -204 -329 35 -225 220 C-89 461 282 377 349 104"/>
</g>
<g font-family="Arial,sans-serif">
<g transform="translate(85 298)"><circle r="30" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text text-anchor="middle" y="7" font-size="20" font-weight="800" fill="#153a2e">1</text><text x="46" y="-8" fill="#faf6ef" font-size="20" font-weight="750">Inherited Faith</text><text x="46" y="18" fill="#dce6df" font-size="15">The faith you were given.</text></g>
<g transform="translate(278 236)"><circle r="30" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text text-anchor="middle" y="7" font-size="20" font-weight="800" fill="#153a2e">2</text><text x="46" y="-8" fill="#faf6ef" font-size="20" font-weight="750">Honest Questions</text><text x="46" y="18" fill="#dce6df" font-size="15">Doubt opens the journey.</text></g>
<g transform="translate(545 326)"><circle r="30" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text text-anchor="middle" y="7" font-size="20" font-weight="800" fill="#153a2e">3</text><text x="-46" y="-8" text-anchor="end" fill="#faf6ef" font-size="20" font-weight="750">Sacred Search</text><text x="-46" y="18" text-anchor="end" fill="#dce6df" font-size="15">You seek with open hands.</text></g>
<g transform="translate(596 596)"><circle r="30" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text text-anchor="middle" y="7" font-size="20" font-weight="800" fill="#153a2e">4</text><text x="-46" y="-8" text-anchor="end" fill="#faf6ef" font-size="20" font-weight="750">New Foundations</text><text x="-46" y="18" text-anchor="end" fill="#dce6df" font-size="15">Faith becomes your own.</text></g>
<g transform="translate(377 758)"><circle r="30" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text text-anchor="middle" y="7" font-size="20" font-weight="800" fill="#153a2e">5</text><text x="46" y="-8" fill="#faf6ef" font-size="20" font-weight="750">Embodied Faith</text><text x="46" y="18" fill="#dce6df" font-size="15">Belief becomes a way of life.</text></g>
<g transform="translate(128 686)"><circle r="30" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text text-anchor="middle" y="7" font-size="20" font-weight="800" fill="#153a2e">6</text><text x="46" y="-8" fill="#faf6ef" font-size="20" font-weight="750">Living Awake</text><text x="46" y="18" fill="#dce6df" font-size="15">Love moves outward.</text></g>
</g>
<circle cx="380" cy="510" r="92" fill="#153a2e" stroke="#8da095" stroke-width="2"/><text x="380" y="492" text-anchor="middle" fill="#faf6ef" font-family="Georgia,serif" font-size="29" font-weight="700">Journeying</text><text x="380" y="529" text-anchor="middle" fill="#faf6ef" font-family="Georgia,serif" font-size="29" font-weight="700">Homeward</text><text x="380" y="559" text-anchor="middle" fill="#e0a443" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">AGAIN AND AGAIN</text>
<g transform="translate(54 846)"><rect width="652" height="58" rx="16" fill="#183d31" stroke="#527164"/><text x="24" y="25" fill="#faf6ef" font-family="Arial,sans-serif" font-size="16" font-weight="700">Every season can become a doorway.</text><text x="24" y="46" fill="#cddbd3" font-family="Arial,sans-serif" font-size="14">The invitation is not to rank your faith—but to take the next honest step.</text></g>
</svg>