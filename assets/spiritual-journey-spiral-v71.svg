<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
<title id="title">Six recurring seasons of the spiritual journey</title>
<desc id="desc">A spiral showing Inherited Faith, Honest Questions, Sacred Search, New Foundations, Embodied Faith, and Living Awake as recurring seasons rather than a straight-line ranking.</desc>
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#061b14" flood-opacity=".25"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#e0a443"/></marker>
</defs>
<rect width="760" height="760" rx="36" fill="#21483b"/>
<text x="380" y="68" text-anchor="middle" fill="#e0a443" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">A LIFELONG MOVEMENT</text>
<text x="380" y="108" text-anchor="middle" fill="#faf6ef" font-family="Georgia,serif" font-size="31" font-weight="700">A spiral, not a straight line.</text>
<path d="M380 638 C225 638 122 528 122 392 C122 238 238 132 380 132 C531 132 638 243 638 383 C638 513 544 603 419 603 C296 603 210 518 210 410 C210 304 285 229 385 229 C479 229 551 296 551 389 C551 474 493 532 416 532 C340 532 284 480 284 411 C284 349 326 306 384 306 C438 306 480 345 480 397 C480 443 448 475 406 475" fill="none" stroke="#e0a443" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#soft)"/>
<circle cx="380" cy="392" r="112" fill="#153a2e" stroke="#8da095" stroke-width="2"/>
<text x="380" y="372" text-anchor="middle" fill="#faf6ef" font-family="Georgia,serif" font-size="31" font-weight="700">Your Spiritual</text>
<text x="380" y="414" text-anchor="middle" fill="#faf6ef" font-family="Georgia,serif" font-size="31" font-weight="700">Journey</text>
<text x="380" y="449" text-anchor="middle" fill="#e0a443" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">DEPTH · GROWTH · RETURN</text>
<g fill="#faf6ef" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
  <text x="380" y="154">Inherited Faith</text>
  <text x="590" y="272">Honest Questions</text>
  <text x="594" y="535">Sacred Search</text>
  <text x="380" y="663">New Foundations</text>
  <text x="166" y="535">Embodied Faith</text>
  <text x="166" y="272">Living Awake</text>
</g>
<text x="380" y="718" text-anchor="middle" fill="#dce6df" font-family="Arial,sans-serif" font-size="14">We return to familiar seasons with new honesty, wisdom, and depth.</text>
</svg>
