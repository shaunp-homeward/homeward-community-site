<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">The six-stage Homeward Journey of Faith</title>
  <desc id="desc">A continuous spiral with six numbered stages, showing that spiritual growth unfolds in seasons and can deepen over time.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b241c" flood-opacity=".22"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#264d40"/>
      <stop offset="1" stop-color="#183d31"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a443"/>
      <stop offset="1" stop-color="#b35a2a"/>
    </linearGradient>
  </defs>
  <rect width="760" height="640" rx="40" fill="url(#panel)"/>
  <circle cx="380" cy="320" r="246" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="380" cy="320" r="184" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
  <circle cx="380" cy="320" r="120" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
  <path d="M168 166
           C105 248 106 384 180 470
           C260 562 413 579 520 504
           C628 429 657 279 586 173
           C522 76 384 52 286 111
           C197 164 169 282 220 366
           C271 449 388 469 464 413
           C532 363 548 263 496 198
           C450 141 360 134 304 177
           C254 216 248 290 286 337
           C320 379 383 389 425 357
           C461 330 467 278 440 246
           C418 220 378 215 352 235" 
        fill="none" stroke="url(#path)" stroke-width="10" stroke-linecap="round"/>

  <g font-family="Inter, Arial, sans-serif" font-weight="700" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(168 166)"><circle r="28" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text y="7" font-size="22" fill="#153a2e">1</text></g>
    <g transform="translate(302 106)"><circle r="28" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text y="7" font-size="22" fill="#153a2e">2</text></g>
    <g transform="translate(586 173)"><circle r="28" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text y="7" font-size="22" fill="#153a2e">3</text></g>
    <g transform="translate(520 504)"><circle r="28" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text y="7" font-size="22" fill="#153a2e">4</text></g>
    <g transform="translate(220 366)"><circle r="28" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text y="7" font-size="22" fill="#153a2e">5</text></g>
    <g transform="translate(425 357)"><circle r="28" fill="#faf6ef" stroke="#b35a2a" stroke-width="5"/><text y="7" font-size="22" fill="#153a2e">6</text></g>
  </g>

  <g transform="translate(380 320)" text-anchor="middle">
    <circle r="82" fill="#153a2e" stroke="#faf6ef" stroke-opacity=".5" stroke-width="2"/>
    <text y="-8" font-family="Playfair Display, Georgia, serif" font-size="30" fill="#faf6ef">Journeying</text>
    <text y="28" font-family="Playfair Display, Georgia, serif" font-size="30" fill="#faf6ef">Homeward</text>
  </g>

  <text x="380" y="606" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#faf6ef" fill-opacity=".84">Faith unfolds in seasons—not a straight line.</text>
</svg>
