- name: v8_front_door
  label: Homepage (V8)
  delete: false
  files:
  - name: v8
    label: Homepage Builder
    file: content/v8.json
    format: json
    editor:
      preview: true
    fields:
    - label: Homepage
      name: homepage
      widget: object
      collapsed: false
      fields:
      - label: Homepage Section Order
        name: section_order
        widget: list
        summary: "↕ {{fields.id}} — {{fields.enabled}}"
        hint: Drag sections into the desired order. Keep each stable ID exactly as provided.
        fields:
        - label: Stable section ID
          name: id
          widget: select
          allow_add: true
          hint: Choose a built-in section or type the stable ID of an optional section.
          options:
          - {label: Hero, value: hero}
          - {label: Invitation / Recognition, value: recognition}
          - {label: Exercises for the Heart and Mind, value: practice_bridge}
          - {label: Four Practices / Gifts, value: gifts}
          - {label: Circle Difference, value: difference}
          - {label: Finding Home, value: finding_home}
          - {label: Spiritual Journey Reflection, value: journey}
          - {label: Practice Bears Fruit, value: practice_bears_fruit}
          - {label: Founder, value: founder}
          - {label: Fit / Not Fit, value: fit}
          - {label: Interest / CTA and Form, value: interest}
          - {label: FAQ, value: faq}
        - {label: Show section, name: enabled, widget: boolean, default: true}
      - label: Hero
        name: hero
        widget: object
        fields:
        - {label: Eyebrow, name: eyebrow, widget: string}
        - {label: Headline, name: headline, widget: string}
        - {label: Emphasis, name: emphasis, widget: string}
        - {label: Description, name: description, widget: markdown, buttons: [bold, italic, link]}
        - {label: Primary CTA, name: primary_label, widget: string}
        - {label: Primary destination, name: primary_url, widget: string}
        - {label: Secondary CTA, name: secondary_label, widget: string}
        - {label: Secondary destination, name: secondary_url, widget: string}
        - {label: Logistics, name: logistics, widget: string}
        - {label: Requirements, name: requirements, widget: string}
        - {label: Hero image, name: image, widget: image}
        - {label: Image alt text, name: image_alt, widget: string}
        - label: Hero facts
          name: fact_items
          widget: list
          summary: "↕ {{fields.line1}} {{fields.line2}}"
          fields:
          - {label: Show item, name: enabled, widget: boolean, default: true}
          - {label: Stable item ID, name: id, widget: string}
          - {label: Icon, name: icon, widget: select, options: [pin, wifi, person, heart, coin, calendar, people, leaf]}
          - {label: First line, name: line1, widget: string}
          - {label: Emphasized line, name: line2, widget: string}
      - label: Finding Home / Season One
        name: finding_home
        widget: object
        fields:
        - {label: Show section, name: enabled, widget: boolean, default: true}
        - {label: Season label, name: eyebrow, widget: string}
        - {label: Program title, name: title, widget: string}
        - {label: Tagline, name: heading, widget: string}
        - {label: Body, name: body, widget: markdown, buttons: [bold, italic, bulleted-list, numbered-list, link]}
        - label: Logistics
          name: logistics
          widget: list
          summary: "↕ {{fields.label}}"
          fields:
          - {label: Show item, name: enabled, widget: boolean, default: true, required: false}
          - {label: Stable item ID, name: id, widget: string, required: false, hint: Optional; use lowercase words and hyphens.}
          - {label: Icon, name: icon, widget: select, required: false, options: [calendar, people, pin, wifi, coin, heart, leaf, chat]}
          - {label: Main fact, name: label, widget: string}
          - {label: Supporting detail, name: detail, widget: string}
        - {label: Availability line, name: availability, widget: string}
        - {label: CTA label, name: link_label, widget: string}
        - {label: CTA destination, name: link_url, widget: string}
      - label: Invitation / Recognition
        name: recognition
        widget: object
        fields:
        - {label: Show section, name: enabled, widget: boolean, default: true}
        - {label: Eyebrow, name: eyebrow, widget: string}
        - {label: Heading, name: heading, widget: string}
        - {label: Intro, name: intro, widget: markdown, buttons: [bold, italic, link]}
        - label: Recognition questions
          name: questions
          widget: list
          summary: "↕ {{fields.text}}"
          fields:
          - {label: Show item, name: enabled, widget: boolean, default: true}
          - {label: Stable item ID, name: id, widget: string}
          - {label: Question, name: text, widget: text}
        - label: Author names
          name: authors
          widget: list
          summary: "↕ {{fields.name}}"
          fields:
          - {label: Show item, name: enabled, widget: boolean, default: true}
          - {label: Stable item ID, name: id, widget: string}
          - {label: Author, name: name, widget: string}
        - {label: Closing line, name: honest_line, widget: text}
      - label: Exercises for the Heart and Mind
        name: practice_bridge
        widget: object
        fields:
        - {label: Show section, name: enabled, widget: boolean, default: true}
        - {label: Eyebrow, name: eyebrow, widget: string}
        - {label: Heading, name: heading, widget: string}
        - {label: Body, name: body, widget: markdown, buttons: [bold, italic, heading-two, heading-three, bulleted-list, numbered-list, link]}
        - {label: Outcome line, name: outcomes, widget: string}
        - {label: Supporting image, name: image, widget: image, required: false}
        - {label: Image alt text, name: image_alt, widget: string, required: false}
        - {label: Image caption, name: image_caption, widget: string, required: false}
        - label: Benefit / outcome items
          name: outcome_items
          widget: list
          summary: "↕ {{fields.line1}} {{fields.line2}}"
          fields:
          - {label: Show item, name: enabled, widget: boolean, default: true}
          - {label: Stable item ID, name: id, widget: string}
          - {label: Icon, name: icon, widget: select, options: [brain, heart, sun, person, leaf, book, prayer]}
          - {label: First line, name: line1, widget: string}
          - {label: Second line, name: line2, widget: string}
      - label: Four Practices / Four Gifts
        name: gifts
        widget: object
        fields:
        - {label: Show section, name: enabled, widget: boolean, default: true}
        - {label: Eyebrow, name: eyebrow, widget: string}
        - {label: Heading, name: heading, widget: string}
        - {label: Editorial bridge, name: bridge, widget: markdown, buttons: [bold, italic, link]}
        - label: Practice cards
          name: items
          widget: list
          summary: "↕ {{fields.title}}"
          fields:
          - {label: Show card, name: enabled, widget: boolean, default: true, required: false}
          - {label: Stable item ID, name: id, widget: string, required: false}
          - {label: Practice, name: title, widget: string}
          - {label: Outcome, name: description, widget: markdown, buttons: [bold, italic, link]}
          - {label: Image, name: image, widget: image, required: false}
          - {label: Image alt text, name: image_alt, widget: string, required: false}
          - {label: Caption, name: caption, widget: string, required: false}
          - {label: Image focus, name: image_focus, widget: select, required: false, default: center, options: [center, top, bottom]}
      - label: Circle Difference
        name: difference
        widget: object
        fields:
        - {label: Show section, name: enabled, widget: boolean, default: true}
        - {label: Eyebrow, name: eyebrow, widget: string}
        - {label: Heading, name: heading, widget: string}
        - label: Editorial paragraphs
          name: paragraphs
          widget: list
          field: {label: Paragraph, name: paragraph, widget: markdown, buttons: [bold, italic, link]}
        - label: Reflection questions
          name: questions
