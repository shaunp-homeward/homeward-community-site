- name: v8_front_door
  label: Homepage (V8)
  delete: false
  files:
  - name: v8
    label: Homepage Builder
    file: content/v8.json
    format: json
    fields:
    - label: Homepage
      name: homepage
      widget: object
      collapsed: false
      fields:
      - label: Homepage section order
        name: section_order
        widget: list
        collapsed: false
        summary: '{{fields.id}}'
        allow_add: true
        allow_remove: true
        allow_reorder: true
        hint: Drag sections into the order you want. Turn Enabled off to hide a section. Protected sections removed from this
          list safely fall back to the default order.
        fields:
        - label: Section ID
          name: id
          widget: string
          hint: Built-in IDs include hero, recognition, practice_bridge, gifts, difference, finding_home, journey, practice_bears_fruit,
            founder, fit, interest, faq. For a custom section, use its custom Stable ID.
        - label: Enabled
          name: enabled
          widget: boolean
          default: true
      - label: Hero
        name: hero
        widget: object
        collapsed: false
        fields:
        - label: Show this section
