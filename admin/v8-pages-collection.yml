  - name: about_v8
    label: Our Story Page (V8)
    file: content/about-v8.json
    format: json
    fields:
    - {label: Version, name: version, widget: string, hint: Technical version label. Normally leave unchanged.}
    - label: Hero
      name: hero
      widget: object
      collapsed: false
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - {label: Big question, name: question, widget: text}
      - {label: Supporting line, name: support, widget: text}
      - label: Hero mosaic photos
        name: images
        widget: list
        allow_add: false
        allow_delete: false
        allow_reorder: false
        min: 4
        max: 4
        summary: '{{fields.alt}}'
        fields:
        - label: Photo
          name: src
          widget: image
          hint: Recommended 1200×900 px or larger, roughly 4:3. Keep faces near center because each mosaic tile crops differently.
        - {label: Photo description, name: alt, widget: string}
        - label: Mosaic position
          name: class
          widget: select
          options: [stupa, teacher, founder, archive]
          hint: Technical layout position. Normally leave unchanged.
    - label: The questions began early
      name: questions
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - label: Story paragraphs
        name: paragraphs
        widget: list
        field: {label: Paragraph, name: paragraph, widget: text}
      - label: Timeline
        name: timeline
        widget: list
        summary: '{{fields.label}} — {{fields.title}}'
        fields:
        - {label: Stage label, name: label, widget: string}
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
    - label: So I went looking
      name: search
      widget: object
      collapsed: false
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - label: Paragraphs
        name: paragraphs
        widget: list
        field: {label: Paragraph, name: paragraph, widget: text}
      - label: Journey photo carousel
        name: photos
        widget: list
        summary: '{{fields.caption}}'
        fields:
        - label: Photo
          name: src
          widget: image
          hint: Recommended 1400×1000 px or larger, roughly 4:3. Keep the subject centered. Use Preserve full image for archival photos that should not be cropped.
        - {label: Photo description, name: alt, widget: string}
        - {label: Caption, name: caption, widget: text}
        - {label: Preserve full image instead of cropping, name: contain, widget: boolean, default: false}
    - label: The return
      name: return
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - label: Paragraphs
        name: paragraphs
        widget: list
        field: {label: Paragraph, name: paragraph, widget: text}
      - {label: Book small heading, name: book_eyebrow, widget: string}
      - {label: Book title, name: book_title, widget: string}
      - {label: Book explanation, name: book_body, widget: text}
      - {label: Pull quote, name: quote, widget: text}
    - label: The missing piece
      name: missing
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: First paragraph, name: paragraph1, widget: text}
      - {label: Second paragraph, name: paragraph2, widget: text}
      - {label: Signature line, name: signature, widget: string}
    - label: Trust + founder section
      name: trust
      widget: object
      collapsed: false
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - label: Trust cards
        name: cards
        widget: list
        summary: '{{fields.title}}'
        fields:
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
      - {label: LinkedIn button label, name: linkedin_label, widget: string}
      - {label: LinkedIn URL, name: linkedin_url, widget: string}
      - label: Founder photo
        name: founder_image
        widget: image
        hint: Recommended 1200×1350 px or larger, near 8:9 portrait. Keep head and shoulders centered; the same image becomes a wider crop on phones/tablets.
      - {label: Founder photo description, name: founder_alt, widget: string}
      - {label: Community heading, name: community_heading, widget: string}
      - label: Community paragraphs
        name: community_paragraphs
        widget: list
        field: {label: Paragraph, name: paragraph, widget: text}
      - label: Homeward is
        name: is
        widget: list
        field: {label: Item, name: item, widget: text}
      - label: Homeward is not
        name: is_not
        widget: list
        field: {label: Item, name: item, widget: text}
      - {label: Disclaimer, name: disclaimer, widget: text}
    - label: Final invitation
      name: final
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - label: Three steps
        name: steps
        widget: list
        allow_add: false
        allow_delete: false
        min: 3
        max: 3
        summary: '{{fields.title}}'
        fields:
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
      - {label: Primary button, name: primary_label, widget: string}
      - {label: Primary destination, name: primary_url, widget: string}
      - {label: Secondary button, name: secondary_label, widget: string}
      - {label: Secondary destination, name: secondary_url, widget: string}
