- name: v8_pages
  label: Other Pages (V8) — EDIT THESE
  delete: false
  editor:
    preview: false
  files:
  - name: photo_guide
    label: Photo Guide — Read First
    file: content/cms-photo-guide.json
    format: json
    fields:
    - {label: Title, name: title, widget: string}
    - {label: Overview, name: intro, widget: text}
    - label: General photo rules
      name: general
      widget: list
      field: {label: Rule, name: rule, widget: text}
    - label: Homepage photo sizes
      name: homepage
      widget: list
      field: {label: Guidance, name: guidance, widget: text}
    - label: Circles photo sizes
      name: circles
      widget: list
      field: {label: Guidance, name: guidance, widget: text}
    - label: Practices photo sizes
      name: practices
      widget: list
      field: {label: Guidance, name: guidance, widget: text}
    - label: Our Story photo sizes
      name: story
      widget: list
      field: {label: Guidance, name: guidance, widget: text}

  - name: circles_v8
    label: Circles Page (V8)
    file: content/circles-v8.json
    format: json
    fields:
    - {label: Version, name: version, widget: string, hint: Technical version label. Normally leave unchanged.}
    - label: Search and sharing
      name: meta
      widget: object
      collapsed: true
      fields:
      - {label: Browser title, name: title, widget: string}
      - {label: Search description, name: description, widget: text}
    - label: Hero
      name: hero
      widget: object
      collapsed: false
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Emphasized line, name: emphasis, widget: string}
      - {label: Intro, name: lead, widget: text}
      - {label: Season line, name: season_line, widget: text}
      - {label: Primary button, name: primary_label, widget: string}
      - {label: Primary destination, name: primary_url, widget: string}
      - {label: Secondary button, name: secondary_label, widget: string}
      - {label: Secondary destination, name: secondary_url, widget: string}
      - label: Logistics chips
        name: facts
        widget: list
        field: {label: Chip, name: chip, widget: string}
      - label: Hero photo — desktop
        name: image
        widget: image
        hint: Recommended 1600×1600 px or larger, near-square. Keep faces and the main subject in the center 60–70% because the desktop panel crops tall.
      - label: Hero photo — mobile crop (optional)
        name: image_mobile
        widget: image
        required: false
        hint: Optional 1600×1200 px 4:3 crop for phones. Leave blank if the desktop image already crops well on mobile.
      - {label: Hero photo description, name: image_alt, widget: string}
    - label: Circle Loop
      name: loop
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - label: Four loop steps
        name: items
        widget: list
        allow_add: false
        allow_delete: false
        allow_reorder: false
        min: 4
        max: 4
        summary: '{{fields.title}}'
        fields:
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
      - {label: Closing line, name: closing, widget: text}
    - label: Why practice matters
      name: practice
      widget: object
      collapsed: false
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - {label: Body, name: body, widget: text}
      - label: Photo
        name: image
        widget: image
        hint: Recommended 1600×1200 px, 4:3. One crop is used on desktop and mobile.
      - {label: Photo description, name: image_alt, widget: string}
      - label: Benefits
        name: benefits
        widget: list
        allow_add: true
        allow_delete: true
        summary: '{{fields.title}}'
        fields:
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
    - label: Four-week seasons
      name: season
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - label: Season cards
        name: items
        widget: list
        summary: '{{fields.title}}'
        fields:
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
    - label: How we talk together
      name: conversation
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - {label: Pull quote, name: quote, widget: text}
      - label: Conversation principles
        name: principles
        widget: list
        summary: '{{fields.title}}'
        fields:
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
    - label: Mid-page conversation invitation
      name: mid_cta
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Text, name: body, widget: text}
      - {label: Primary button, name: primary_label, widget: string}
      - {label: Primary destination, name: primary_url, widget: string}
      - {label: Secondary link, name: secondary_label, widget: string}
      - {label: Secondary destination, name: secondary_url, widget: string}
    - label: Gathering agenda + sample
      name: agenda
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - label: Gathering rhythm
        name: items
        widget: list
        summary: '{{fields.time}} — {{fields.title}}'
        fields:
        - {label: Time, name: time, widget: string}
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
      - {label: Sample-session dropdown label, name: sample_summary, widget: string}
      - label: Sample-session rows
        name: sample_items
        widget: list
        collapsed: true
        summary: '{{fields.time}} — {{fields.title}}'
        fields:
        - {label: Time, name: time, widget: string}
        - {label: Title, name: title, widget: string}
        - {label: Body, name: body, widget: text, required: false}
        - label: Questions
          name: questions
          widget: list
          required: false
          field: {label: Question, name: question, widget: text}
    - label: Tools for the spiritual life
      name: tools
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - label: Practice cards
        name: items
        widget: list
        summary: '{{fields.title}}'
        fields:
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
      - {label: Closing line, name: closing, widget: text}
    - label: Small-group comparison
      name: comparison
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - {label: Left-column heading, name: left_heading, widget: string}
      - label: Left-column items
        name: left_items
        widget: list
        summary: '{{fields.title}}'
        fields:
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
      - {label: Homeward-column heading, name: right_heading, widget: string}
      - label: Homeward-column items
        name: right_items
        widget: list
        summary: '{{fields.title}}'
        fields:
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
      - {label: Closing note, name: note, widget: text}
    - label: How joining works
      name: join
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - label: Three steps
        name: items
        widget: list
        allow_add: false
        allow_delete: false
        min: 3
        max: 3
        summary: '{{fields.title}}'
        fields:
        - {label: Title, name: title, widget: string}
        - {label: Description, name: body, widget: text}
        - {label: Optional link label, name: link_label, widget: string, required: false}
        - {label: Optional link destination, name: link_url, widget: string, required: false}
    - label: Fit section
      name: fit
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - {label: Positive heading, name: fit_heading, widget: string}
      - label: Positive items
        name: fit_items
        widget: list
        field: {label: Item, name: item, widget: text}
      - {label: Not-fit heading, name: not_heading, widget: string}
      - label: Not-fit items
        name: not_items
        widget: list
        field: {label: Item, name: item, widget: text}
    - label: Final invitation
      name: final
      widget: object
      collapsed: true
      fields:
      - {label: Small heading, name: eyebrow, widget: string}
      - {label: Heading, name: heading, widget: string}
      - {label: Intro, name: lead, widget: text}
      - {label: Primary button, name: primary_label, widget: string}
      - {label: Primary destination, name: primary_url, widget: string}
      - {label: Secondary button, name: secondary_label, widget: string}
      - {label: Secondary destination, name: secondary_url, widget: string}
      - {label: Final note, name: note, widget: text}

