      - label: Small heading
        name: eyebrow
        widget: string
      - label: Heading
        name: heading
        widget: string
      - label: Intro
        name: intro
        widget: text
      - label: Six questions
        name: questions
        widget: list
        allow_add: false
        allow_delete: false
        allow_reorder: false
        collapsed: true
        field:
          label: Question
          name: question
          widget: text
        min: 6
        max: 6
