backend:
  name: github
  repo: shaunp-homeward/homeward-community-site
  branch: staging
  squash_merges: true
  use_graphql: true
local_backend: true
publish_mode: editorial_workflow
site_url: https://staging--homeward-community-dfw.netlify.app
display_url: https://staging--homeward-community-dfw.netlify.app
logo_url: https://homewardcommunity.com/assets/logo-forest.png
media_folder: assets/uploads
public_folder: /assets/uploads
editor:
  preview: false
collections:
- name: site_content
  label: Main Site Content
  delete: false
  files:
  - name: global
    label: Global Site Copy
    file: content/global.json
    format: json
    fields:
    - label: Brand and footer
      name: brand
      widget: object
      collapsed: false
      fields:
      - label: Brand name
        name: name
        widget: string
      - label: Brand subline
        name: subline
        widget: string
      - label: Footer description
        name: footer_description
        widget: text
      - label: Mission line
        name: mission
        widget: string
      - label: Copyright line
        name: copyright
        widget: string
    - label: Navigation labels
      name: navigation
      widget: object
      collapsed: false
      fields:
