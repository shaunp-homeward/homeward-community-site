        name: honest_line
        widget: text
      - label: Let’s Talk strip
        name: conversation
        widget: object
        collapsed: false
        fields:
        - label: Heading
          name: heading
          widget: string
        - label: Text
          name: text
          widget: text
        - label: Button label
          name: button
