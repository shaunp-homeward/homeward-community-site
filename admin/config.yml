        name: home
        widget: string
      - label: Circles
        name: circles
        widget: string
      - label: Practices
        name: practices
        widget: string
      - label: Journey
        name: journey
        widget: string
      - label: Our Story
        name: story
        widget: string
      - label: Interest button
        name: interest
        widget: string
      - label: Conversation button
        name: conversation
        widget: string
      - label: Mobile conversation button
        name: mobile_conversation
        widget: string
    - label: Footer labels
