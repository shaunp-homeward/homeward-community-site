        name: heading_line1
        widget: string
      - label: Heading line 2
        name: heading_line2
        widget: string
      - label: Registration badge
        name: badge
        widget: string
      - label: Logistics line
        name: logistics_line
        widget: string
        hint: Short line shown below the registration badge, such as location, cost, group size, and length.
      - label: Description
        name: description
        widget: text
        hint: Separate paragraphs with a blank line. Use <strong>words</strong> when a short phrase should appear bold.
      - label: Differentiator line
        name: differentiator_line
        widget: string
        hint: Short signature line shown between the description and gathering flow.
      - label: Image quote
        name: quote
        widget: text
      - label: Image
        name: image
        widget: image
      - label: Gathering flow
        name: steps
        widget: list
        allow_add: false
        allow_delete: false
        allow_reorder: false
        collapsed: true
