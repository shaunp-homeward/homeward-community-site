      - label: Headline
        name: headline
        widget: string
      - label: Emphasized line
        name: emphasis
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Primary button label
        name: primary_label
        widget: string
      - label: Primary button destination
        name: primary_url
        widget: string
        hint: Use calendar to open the Homeward conversation calendar. Otherwise use a relative page or section such as 
          circles.html or index.html#interest.
      - label: Secondary button label
        name: secondary_label
        widget: string
      - label: Secondary button destination
        name: secondary_url
        widget: string
        hint: Use calendar to open the Homeward conversation calendar. Otherwise use a relative page or section such as 
          circles.html or index.html#interest.
    - label: Rooted in Jesus welcome line
      name: rooted_line
      widget: text
    - label: Invitation questions
      name: recognition
      widget: object
      collapsed: true
      fields:
      - label: Show this section on the homepage
        name: enabled
        widget: boolean
