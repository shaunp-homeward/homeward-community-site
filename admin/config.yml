backend:
  name: github
  repo: shaunp-homeward/homeward-community-site
  branch: staging
  squash_merges: true
  use_graphql: true

local_backend: true
publish_mode: editorial_workflow
site_url: https://staging--homeward-community-dfw.netlify.app
display_url: https://staging--homeward-community-dfw.netlify.app
logo_url: https://homewardcommunity.com/assets/logo-forest.png
media_folder: assets/uploads
public_folder: /assets/uploads

editor:
  preview: false

collections:
  - name: site_pages
    label: Website Pages
    delete: false
    files:
      - name: home
        label: Homepage
        file: content/home.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: Headline, name: headline, widget: string }
              - { label: Emphasized word or line, name: emphasis, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Primary button label, name: primary_label, widget: string }
              - { label: Primary button URL, name: primary_url, widget: string }
              - { label: Secondary button label, name: secondary_label, widget: string }
              - { label: Secondary button URL, name: secondary_url, widget: string }

          - { label: Rooted in Jesus welcome line, name: rooted_line, widget: text }

          - label: Recognition Questions
            name: recognition
            widget: object
            collapsed: true
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
              - label: Questions
                name: questions
                widget: list
                field: { label: Question, name: question, widget: text }
              - { label: Honest beginning line, name: honest_line, widget: text }

          - label: Homeward Circles
            name: circles
            widget: object
            collapsed: false
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading line 1, name: heading_line1, widget: string }
              - { label: Heading line 2, name: heading_line2, widget: string }
              - { label: Availability badge, name: badge, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Image quote, name: quote, widget: text }
              - { label: Circle image, name: image, widget: image }
              - label: Gathering flow
                name: steps
                widget: list
                fields:
                  - { label: Step title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
              - { label: Primary button label, name: primary_label, widget: string }
              - { label: Secondary button label, name: secondary_label, widget: string }

          - label: Belong · Grow · Become
            name: values
            widget: object
            collapsed: true
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: text }
              - { label: Intro, name: intro, widget: text }
              - label: Three values
                name: items
                widget: list
                min: 3
                max: 3
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }

          - label: Practices
            name: practices
            widget: object
            collapsed: true
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
              - label: Practices
                name: items
                widget: list
                fields:
                  - label: Icon key
                    name: key
                    widget: select
                    options: [light, breath, maranatha, reading, reflection, gratitude]
                  - { label: Title, name: title, widget: string }
                  - { label: Subtitle, name: subtitle, widget: string, required: false }
                  - { label: Description, name: description, widget: text }
              - { label: Primary button label, name: primary_label, widget: string }
              - { label: Secondary button label, name: secondary_label, widget: string }

          - label: Journey of Faith
            name: journey
            widget: object
            collapsed: true
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Journey image or infographic, name: image, widget: image }
              - label: Stages
                name: stages
                widget: list
                min: 6
                max: 6
                fields:
                  - { label: Stage title, name: title, widget: string }
                  - { label: Stage description, name: description, widget: text }
              - { label: Benefit box heading, name: benefit_heading, widget: string }
              - { label: Benefit box text, name: benefit_text, widget: text }
              - { label: Button label, name: cta_label, widget: string }

          - label: We Gather to Remember
            name: remembering
            widget: object
            collapsed: false
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Main heading, name: heading, widget: string }
              - { label: Emphasized heading line, name: emphasis, widget: string }
              - { label: Intro paragraph, name: intro1, widget: text }
              - { label: Intro closing line, name: intro2, widget: text }
              - label: Remembering statements
                name: items
                widget: list
                field: { label: Statement, name: statement, widget: string }
              - { label: Community image, name: community_image, widget: image }
              - { label: Awe and wonder image, name: wonder_image, widget: image }
              - { label: Why remembering matters heading, name: why_heading, widget: string }
              - { label: Why remembering matters text, name: why_text, widget: text }
              - { label: Footer invitation, name: footer_text, widget: text }
              - { label: Primary button label, name: primary_label, widget: string }
              - { label: Secondary button label, name: secondary_label, widget: string }

          - label: Interest Form Section
            name: interest
            widget: object
            collapsed: true
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Calendar box heading, name: calendar_heading, widget: string }
              - { label: Calendar box text, name: calendar_text, widget: text }
              - { label: Calendar button label, name: calendar_button, widget: string }

          - label: Final Invitation
            name: final
            widget: object
            collapsed: true
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Description, name: description, widget: text }


      - name: circles
        label: Circles Page
        file: content/circles.json
        format: json
        fields:
          - label: Page Metadata
            name: meta
            widget: object
            fields:
              - { label: Browser title, name: title, widget: string }
              - { label: Search description, name: description, widget: text }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Main heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
              - { label: Primary button, name: primary, widget: string }
              - { label: Secondary button, name: secondary, widget: string }
          - label: The Heart of Homeward
            name: heart
            widget: object
            fields:
              - { label: Main image, name: image, widget: image }
              - { label: Image description, name: image_alt, widget: string }
              - { label: Image caption, name: caption, widget: text }
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
              - { label: Body paragraph, name: body, widget: text }
              - { label: Highlight heading, name: urgency_heading, widget: string }
              - { label: Highlight text, name: urgency_text, widget: text }
              - { label: Primary button, name: primary, widget: string }
              - { label: Secondary button, name: secondary, widget: string }
          - label: Gathering Rhythm
            name: rhythm
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
              - label: Steps
                name: steps
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: Sample Session
            name: sample
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
              - { label: Week label, name: week, widget: string }
              - { label: Session title, name: title, widget: string }
              - { label: Session description, name: description, widget: text }
              - label: Session flow
                name: items
                widget: list
                fields:
                  - { label: Time label, name: time, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text, required: false }
                  - label: Questions
                    name: questions
                    widget: list
                    required: false
                    field: { label: Question, name: question, widget: string }
          - label: Who Circles Are For
            name: fit
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Positive column heading, name: fit_heading, widget: string }
              - label: Positive items
                name: fit_items
                widget: list
                field: { label: Item, name: item, widget: string }
              - { label: Reassurance column heading, name: not_heading, widget: string }
              - label: Reassurance items
                name: not_items
                widget: list
                field: { label: Item, name: item, widget: string }
          - label: Final Invitation
            name: final
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
              - { label: Primary button, name: primary, widget: string }
              - { label: Secondary button, name: secondary, widget: string }

      - name: practices
        label: Practices Page
        file: content/practices.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Main heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
              - { label: Primary button, name: primary, widget: string }
              - { label: Secondary button, name: secondary, widget: string }
          - label: Practice Introduction
            name: intro
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
          - label: Practices
            name: items
            widget: list
            fields:
              - { label: Anchor ID, name: id, widget: string }
              - { label: Tradition label, name: tradition, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Steps
                name: steps
                widget: list
                field: { label: Step, name: step, widget: text }
              - { label: Optional button, name: button, widget: string, required: false }
          - label: Practice in Community
            name: community
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
              - { label: Primary button, name: primary, widget: string }
              - { label: Secondary button, name: secondary, widget: string }

      - name: about
        label: Our Story Page
        file: content/about.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Main heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
          - label: Why Homeward Began
            name: origin
            widget: object
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Image description, name: image_alt, widget: string }
              - { label: Image caption, name: caption, widget: text }
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
              - label: Additional paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: Formation and Experience
            name: formation
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - label: Items
                    name: items
                    widget: list
                    field: { label: Item, name: item, widget: text }
          - label: Community Section
            name: community
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
              - { label: Button, name: button, widget: string }

      - name: connect
        label: Conversation Page
        file: content/connect.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Main heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
          - label: What to Expect
            name: expect
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Items
                name: items
                widget: list
                field: { label: Item, name: item, widget: text }
              - { label: Not-ready line, name: not_ready, widget: text }

      - name: vision
        label: Future Vision Page
        file: content/vision.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Main heading, name: heading, widget: string }
              - { label: Intro, name: lead, widget: text }
          - label: Vision Areas
            name: items
            widget: list
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Image description, name: alt, widget: string }
              - { label: Lightbox title, name: lightbox_title, widget: string }
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Description, name: lead, widget: text }
          - { label: Concept note, name: note, widget: text }
