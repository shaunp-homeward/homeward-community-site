        name: practices
        widget: string
      - label: Journey
        name: journey
        widget: string
      - label: Resources
        name: resources
        widget: string
      - label: Our Story
        name: story
        widget: string
      - label: Vision
        name: vision
        widget: string
      - label: Connect heading
        name: connect_heading
        widget: string
      - label: Interest
        name: interest
        widget: string
      - label: Conversation
        name: conversation
        widget: string
      - label: Conversation details
        name: conversation_details
        widget: string
      - label: Privacy
        name: privacy
        widget: string
    - label: Small interest invitation
      name: interest_prompt
      widget: object
      collapsed: true
