<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Homeward Content Editor</title>
  <link rel="icon" href="/assets/mark-forest.png" />
</head>
<body>
  <script>
    // Manual initialization lets the deployed site choose its Git branch at runtime
    // without requiring a branch-specific edit to admin/config.yml.
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="/admin/runtime-config.js"></script>
  <script>
    (function () {
      const netlifyHost = window.location.hostname;
      const netlifySite = 'homeward-community-dfw.netlify.app';
      let hostBranch = '';

      // Netlify's default branch-deploy hostname is branch--site.netlify.app.
      // Ignore deploy-preview/permalink hosts so they fall back to the build-time branch.
      const marker = `--${netlifySite}`;
      if (netlifyHost.endsWith(marker)) {
        const prefix = netlifyHost.slice(0, -marker.length);
        if (prefix && !prefix.startsWith('deploy-preview-') && !/^[0-9a-f]{10,}$/i.test(prefix)) {
          hostBranch = prefix;
        }
      }

      const configuredBranch = window.__HOMEWARD_CMS_BRANCH || 'cms-staging-v8';
      const branch = hostBranch || configuredBranch;
      const safeBranch = branch === 'main' ? 'cms-staging-v8' : branch;
      const siteUrl = window.location.origin;
      const init = window.initCMS;

      if (typeof init !== 'function') {
        throw new Error('Decap CMS failed to expose initCMS.');
      }

      init({
        config: {
          backend: {
            branch: safeBranch,
          },
          site_url: siteUrl,
          display_url: siteUrl,
          editor: {
            preview: true,
          },
        },
      });
    }());
  </script>
  <!-- Single branch-aware V8 homepage preview. Other V8 pages use the branch-deploy preview. -->
  <script src="/admin/preview-v8-safe.js?v=20260812-v8-pages-photo-controls"></script>
</body>
</html>
