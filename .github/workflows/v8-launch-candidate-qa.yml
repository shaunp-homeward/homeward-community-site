name: V8 Launch Candidate QA

on:
  push:
    branches:
      - v8-four-week-front-door
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        run: npm run build

      - name: Verify launch candidate
        run: npm run verify

      - name: Create complete source backup ZIP
        shell: bash
        run: |
          zip -rq Homeward_V8_Final_Launch_Candidate.zip . \
            -x '.git/*' 'node_modules/*' '.netlify/*' 'Homeward_V8_Final_Launch_Candidate.zip'

      - name: Upload source backup
        uses: actions/upload-artifact@v4
        with:
          name: Homeward_V8_Final_Launch_Candidate
          path: Homeward_V8_Final_Launch_Candidate.zip
          if-no-files-found: error
          retention-days: 30
