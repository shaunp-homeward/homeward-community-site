name: V8 Site QA

on:
  push:
    branches:
      - v8-four-week-front-door
      - cms-staging-v8
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npm run build

      - name: Check approved homepage layout
        run: |
          node --check scripts/apply-homepage-layout-review.mjs
          test -s dist/assets/homepage-layout-review.css
          grep -q 'hr-heading-line' dist/index.html
          grep -Eq 'FORMATION FOR GROUPS|FAITH INTO PRACTICE' dist/index.html

      - name: Create complete source backup ZIP
        shell: bash
        run: |
          zip -rq Homeward_V8_Site_Backup.zip . \
            -x '.git/*' 'node_modules/*' '.netlify/*' 'Homeward_V8_Site_Backup.zip'

      - name: Upload source backup
        uses: actions/upload-artifact@v4
        with:
          name: Homeward_V8_Site_Backup
          path: Homeward_V8_Site_Backup.zip
          if-no-files-found: error
          retention-days: 30
